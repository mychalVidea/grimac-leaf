name: Auto-Sync & Build GrimAC for Leaf

on:
  schedule:
    # Automatické sestavení každou neděli ve 4:00 UTC ráno
    - cron: '0 4 * * 0'
  workflow_dispatch:
    # Tlačítko na ruční spuštění přímo z GitHub webového rozhraní

permissions:
  contents: write

jobs:
  build:
    name: Sync, Patch & Build GrimAC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Upstream Grim (GrimAnticheat/Grim)
        uses: actions/checkout@v4
        with:
          repository: 'GrimAnticheat/Grim'
          ref: '2.0'
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Patch for Leaf Async Mode
        run: |
          echo "Disabling Fabric modules to optimize build time..."
          sed -i '/include.*fabric/d' settings.gradle.kts

          echo "Patching platform detection to enable Folia/Leaf Async Schedulers..."
          sed -i 's|if (ReflectionUtils.hasClass("io.papermc.paper.threadedregions.RegionizedServer")) return Platform.FOLIA;|if (ReflectionUtils.hasClass("io.papermc.paper.threadedregions.RegionizedServer") \|\| ReflectionUtils.hasClass("org.dreeam.leaf.event.AsyncPreAuthenticateEvent")) return Platform.FOLIA;|g' common/src/main/java/ac/grim/grimac/GrimAPI.java

      - name: Build GrimAC Bukkit with ShadowJar
        run: ./gradlew :bukkit:assemble -x test -x spotlessCheck --no-daemon

      - name: Locate Build Artifact
        id: find_jar
        run: |
          JAR_PATH=$(find bukkit/build/libs/ -name "grimac-bukkit-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          echo "Found jar: $JAR_PATH"
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
          JAR_NAME=$(basename "$JAR_PATH")
          echo "jar_name=$JAR_NAME" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-leaf-build
          name: "GrimAC (Leaf Async Build) - Auto-Updated"
          body: |
            Automaticky sestavený nejnovější build GrimAC optimalizovaný pro **Leaf API & Folia Async Schedulers**.
            
            - **Upstream repozitář:** [GrimAnticheat/Grim](https://github.com/GrimAnticheat/Grim) (větev `2.0`)
            - **Режim:** Plně asynchronní (Leaf Async Schedulers + Concurrent Chunk Cache)
            - **Java:** 25 (required by Leaf 26.x)
            - **Aktualizováno:** Každou neděli automaticky nebo na vyžádání.
          files: ${{ steps.find_jar.outputs.jar_path }}
          prerelease: false
          draft: false
