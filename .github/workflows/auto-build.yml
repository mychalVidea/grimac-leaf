name: Auto-Sync & Build GrimAC for Leaf

on:
  push:
    branches: [ main ]
  schedule:
    # Automatická kontrola nových upstream commitů každé 4 hodiny
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Vynutit sestavení i bez nového upstream commitu'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: grimac-leaf-auto-build
  cancel-in-progress: true

jobs:
  check-upstream:
    name: Check Upstream Changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      upstream_msg: ${{ steps.check.outputs.upstream_msg }}
      upstream_date: ${{ steps.check.outputs.upstream_date }}
    steps:
      - name: Query Upstream Grim Commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && (inputs.force_build == true || inputs.force_build == 'true') }}
          IS_PUSH: ${{ github.event_name == 'push' }}
        run: |
          echo "Zjišťuji nejnovější commit v GrimAnticheat/Grim (větev 2.0)..."
          UPSTREAM_DATA=$(curl -s -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/GrimAnticheat/Grim/commits/2.0")
          UPSTREAM_SHA=$(echo "$UPSTREAM_DATA" | jq -r '.sha // empty')
          UPSTREAM_MSG=$(echo "$UPSTREAM_DATA" | jq -r '.commit.message // ""' | head -n 1)
          UPSTREAM_DATE=$(echo "$UPSTREAM_DATA" | jq -r '.commit.committer.date // ""')

          if [ -z "$UPSTREAM_SHA" ]; then
            echo "::warning::Nepodařilo se načíst upstream SHA z GitHub API. Pro jistotu spustíme build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=unknown" >> "$GITHUB_OUTPUT"
            echo "upstream_msg=Manual/Fallback build" >> "$GITHUB_OUTPUT"
            echo "upstream_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Nejnovější upstream commit: ${UPSTREAM_SHA}"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          echo "upstream_msg=${UPSTREAM_MSG}" >> "$GITHUB_OUTPUT"
          echo "upstream_date=${UPSTREAM_DATE}" >> "$GITHUB_OUTPUT"

          # Zjistíme naposledy sestavený SHA z těla existujícího releasu
          LAST_RELEASE_BODY=$(gh release view --repo "${REPO}" --json body -q '.body' 2>/dev/null || true)
          LAST_BUILT_SHA=$(echo "$LAST_RELEASE_BODY" | grep -oP 'GrimAnticheat/Grim/commit/\K[a-f0-9]{40}' | head -n 1 || true)
          echo "Naposledy sestavený upstream SHA: ${LAST_BUILT_SHA:-žádný}"

          if [ "$FORCE" = "true" ] || [ "$IS_PUSH" = "true" ]; then
            echo "Spuštěno ručně nebo při push do main -> stavíme."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$LAST_BUILT_SHA" ] && [ "$LAST_BUILT_SHA" = "$UPSTREAM_SHA" ]; then
            echo "Upstream Grim je beze změny (${UPSTREAM_SHA} je již sestaven). Přeskakuji kompilaci."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Detekován nový upstream commit! Spouštím sestavení."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Sync, Patch & Build GrimAC
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Upstream Grim (GrimAnticheat/Grim)
        uses: actions/checkout@v4
        with:
          repository: 'GrimAnticheat/Grim'
          ref: '2.0'
          fetch-depth: 0

      - name: Checkout Customizations (grimac-leaf)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: 'main'
          path: 'custom-repo'

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Apply MYCHAL SMP Customizations (Debloat, Design, Leaf & Java 25)
        run: |
          chmod +x custom-repo/custom/patches/apply-patches.sh
          ./custom-repo/custom/patches/apply-patches.sh custom-repo/custom
          rm -rf custom-repo

      - name: Build GrimAC Bukkit with ShadowJar
        run: ./gradlew :bukkit:assemble -x test -x spotlessCheck --no-daemon

      - name: Prepare Clean Build Artifact (grimac-leaf.jar)
        id: prepare_jar
        shell: bash
        run: |
          RAW_JAR=$(find bukkit/build/libs/ -name "grimac-bukkit-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          if [ -z "$RAW_JAR" ] || [ ! -f "$RAW_JAR" ]; then
            echo "::error::Build artifact grimac-bukkit-*.jar nebyl nalezen!"
            exit 1
          fi
          echo "Nalezen sestavený JAR: $RAW_JAR"

          # Přejmenování na čistý název bez verzí a čísel na konci
          CLEAN_JAR="bukkit/build/libs/grimac-leaf.jar"
          cp "$RAW_JAR" "$CLEAN_JAR"
          echo "Vytvořen čistý artefakt: $CLEAN_JAR"
          echo "jar_path=$CLEAN_JAR" >> "$GITHUB_OUTPUT"

      - name: Delete Old Releases and Tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "Čištění starých releases a tagů..."
          RELEASES=$(gh release list --repo "$REPO" --limit 100 --json tagName -q '.[].tagName' 2>/dev/null || true)
          for tag in $RELEASES; do
            if [ -n "$tag" ]; then
              echo "Mažu existující release: $tag"
              gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag || echo "::warning::Nepodařilo se smazat release $tag"
            fi
          done

          # Odstranění případných osiřelých tagů
          while read -r encoded_tag; do
            [ -z "$encoded_tag" ] && continue
            echo "Mažu tag: ${encoded_tag}..."
            gh api -X DELETE "repos/${REPO}/git/refs/tags/${encoded_tag}" 2>/dev/null || true
          done < <(gh api --paginate "repos/${REPO}/tags" --jq '.[].name | @uri' 2>/dev/null || true)

      - name: Create Clean GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          target_commitish: "main"
          name: "GrimAC Leaf"
          body: |
            Automaticky sestavený nejnovější build GrimAC optimalizovaný pro **Leaf API (Minecraft 26.x)** a **Java 25**.

            ### 💎 Provedené úpravy (MYCHAL SMP Custom Edition):
            - **Sladění s designovým systémem MYCHAL SMP:**
              - Odstraněny veškeré ošklivé prefixy zpráv (`prefix: ""`).
              - Oficiální brand barevná paleta (Modrá `#0a67e5`, Červená `#f51515`, Zelená `#21DE00`, Šedá `#94a3b8`).
              - Prémiová uzavřenost a MiniMessage formátování (bez technického šumu).
            - **Nativní Leaf & Java 25 optimalizace:**
              - Kompilováno přímo proti `cn.dreeam.leaf:leaf-api:26.3.local-SNAPSHOT`.
              - Plný Java 25 toolchain a UTF-8 bytecode kompilace pro maximální výkon.
            - **Debloat (vyčištění zbytečností):**
              - Kompletně odstraněna bStats telemetrie (žádné externí HTTP požadavky).
              - Odstraněn integrovaný update checker (žádné falešné varovné hlášky v konzoli).
              - Vypnuty nepoužívané Fabric moduly pro zrychlení a odlehčení.

            ---
            - **Soubor:** `grimac-leaf.jar`
            - **Upstream commit:** [GrimAnticheat/Grim@${{ needs.check-upstream.outputs.upstream_sha }}](https://github.com/GrimAnticheat/Grim/commit/${{ needs.check-upstream.outputs.upstream_sha }})
            - **Zpráva commitu:** `${{ needs.check-upstream.outputs.upstream_msg }}`
            - **Datum upstreamu:** `${{ needs.check-upstream.outputs.upstream_date }}`
            - **Přímé stažení:** [grimac-leaf.jar](https://github.com/${{ github.repository }}/releases/latest/download/grimac-leaf.jar)
          files: ${{ steps.prepare_jar.outputs.jar_path }}
          prerelease: false
          draft: false
          make_latest: 'true'
