name: Auto-Sync & Build GrimAC for Leaf

on:
  push:
    branches: [ main ]
  schedule:
    # Automatické sestavení každou neděli ve 4:00 UTC ráno
    - cron: '0 4 * * 0'
  workflow_dispatch:
    # Tlačítko na ruční spuštění přímo z GitHub webového rozhraní

permissions:
  contents: write

concurrency:
  group: grimac-leaf-auto-build
  cancel-in-progress: true

jobs:
  build:
    name: Sync, Patch & Build GrimAC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Upstream Grim (GrimAnticheat/Grim)
        uses: actions/checkout@v4
        with:
          repository: 'GrimAnticheat/Grim'
          ref: '2.0'
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Patch for Leaf API
        run: |
          echo "Disabling Fabric modules to optimize build time..."
          sed -i '/include.*fabric/d' settings.gradle.kts

          echo "Configuring Leaf Maven repository and Leaf API dependency..."
          sed -i 's|repositories {|repositories {\n    maven("https://maven.leafmc.one/snapshots/")|g' bukkit/build.gradle.kts
          sed -i 's|compileOnly(libs.paper.api)|compileOnly("cn.dreeam.leaf:leaf-api:26.3.local-SNAPSHOT")|g' bukkit/build.gradle.kts

          echo "Configuring Java 25 toolchain for bukkit module (required for leaf-api 26.x class version 69.0)..."
          echo "tasks.withType<JavaCompile>().configureEach { options.release.set(25) }" >> bukkit/build.gradle.kts
          echo "java { toolchain.languageVersion.set(JavaLanguageVersion.of(25)) }" >> bukkit/build.gradle.kts

      - name: Build GrimAC Bukkit with ShadowJar
        run: ./gradlew :bukkit:assemble -x test -x spotlessCheck --no-daemon

      - name: Rename JAR (bukkit → leaf)
        run: |
          for f in bukkit/build/libs/grimac-bukkit-*.jar; do
            mv "$f" "${f/grimac-bukkit-/grimac-leaf-}"
          done

      - name: Locate Build Artifact
        id: find_jar
        shell: bash
        run: |
          JAR_PATH=$(find bukkit/build/libs/ -name "grimac-leaf-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          if [ -z "$JAR_PATH" ] || [ ! -f "$JAR_PATH" ]; then
            echo "::error::Build artifact grimac-leaf-*.jar was not found!"
            exit 1
          fi
          echo "Found jar: $JAR_PATH"
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          JAR_NAME=$(basename "$JAR_PATH")
          echo "jar_name=$JAR_NAME" >> "$GITHUB_OUTPUT"

          BASE_VERSION="${JAR_NAME#grimac-leaf-}"
          BASE_VERSION="${BASE_VERSION%.jar}"
          if [ "${{ github.run_attempt }}" = "1" ]; then
            RELEASE_TAG="v${BASE_VERSION}-b${{ github.run_number }}"
          else
            RELEASE_TAG="v${BASE_VERSION}-b${{ github.run_number }}.${{ github.run_attempt }}"
          fi
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create New GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.find_jar.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: "GrimAC (Leaf Build) - ${{ steps.find_jar.outputs.base_version }}"
          body: |
            Automaticky sestavený nejnovější build GrimAC optimalizovaný pro **Leaf API (Minecraft 26.x)**.

            - **Verze buildu:** `${{ steps.find_jar.outputs.base_version }}` (run #${{ github.run_number }})
            - **Upstream repozitář:** [GrimAnticheat/Grim](https://github.com/GrimAnticheat/Grim) (větev `2.0`)
            - **API cíl:** `cn.dreeam.leaf:leaf-api:26.3.local-SNAPSHOT` ([maven.leafmc.one/snapshots](https://maven.leafmc.one/snapshots/))
            - **Architektura:** Asynchronní Netty packet processing + tick-synchronní determinismus
            - **Java:** 25 (LTS)
            - **Aktualizováno:** Každou neděli automaticky nebo na vyžádání.
          files: ${{ steps.find_jar.outputs.jar_path }}
          prerelease: false
          draft: false
          make_latest: 'true'

      - name: Delete Old Releases and Tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_TAG: ${{ steps.find_jar.outputs.release_tag }}
        run: |
          echo "Cleaning up old releases (keeping only ${CURRENT_TAG})..."
          while IFS='|' read -r rel_id rel_tag; do
            [ -z "$rel_id" ] && continue
            echo "Deleting old release ID=${rel_id} (tag=${rel_tag:-none})..."
            gh api -X DELETE "repos/${REPO}/releases/${rel_id}" || echo "::warning::Failed to delete release ID=${rel_id}"
          done < <(gh api --paginate "repos/${REPO}/releases" --jq --arg current "$CURRENT_TAG" '.[] | select(.tag_name != $current) | "\(.id)|\(.tag_name // "")"')

          echo "Cleaning up old git tags (keeping only ${CURRENT_TAG})..."
          while read -r encoded_tag; do
            [ -z "$encoded_tag" ] && continue
            echo "Deleting old tag: ${encoded_tag}..."
            gh api -X DELETE "repos/${REPO}/git/refs/tags/${encoded_tag}" || echo "::warning::Failed to delete tag ${encoded_tag}"
          done < <(gh api --paginate "repos/${REPO}/tags" --jq --arg current "$CURRENT_TAG" '.[] | select(.name != $current) | (.name | @uri)')
