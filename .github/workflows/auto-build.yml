name: Auto-Sync & Build GrimAC for Leaf

on:
  push:
    branches: [ main ]
  schedule:
    # Automatické sestavení každou neděli ve 4:00 UTC ráno
    - cron: '0 4 * * 0'
  workflow_dispatch:
    # Tlačítko na ruční spuštění přímo z GitHub webového rozhraní

permissions:
  contents: write

jobs:
  build:
    name: Sync, Patch & Build GrimAC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Upstream Grim (GrimAnticheat/Grim)
        uses: actions/checkout@v4
        with:
          repository: 'GrimAnticheat/Grim'
          ref: '2.0'
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Patch for Leaf API
        run: |
          echo "Disabling Fabric modules to optimize build time..."
          sed -i '/include.*fabric/d' settings.gradle.kts

          echo "Configuring Leaf Maven repository and Leaf API dependency..."
          sed -i 's|repositories {|repositories {\n    maven("https://maven.leafmc.one/snapshots/")|g' bukkit/build.gradle.kts
          sed -i 's|compileOnly(libs.paper.api)|compileOnly("cn.dreeam.leaf:leaf-api:26.3.local-SNAPSHOT")|g' bukkit/build.gradle.kts

          echo "Configuring Java 25 toolchain for bukkit module (required for leaf-api 26.x class version 69.0)..."
          echo "tasks.withType<JavaCompile>().configureEach { options.release.set(25) }" >> bukkit/build.gradle.kts
          echo "java { toolchain.languageVersion.set(JavaLanguageVersion.of(25)) }" >> bukkit/build.gradle.kts

      - name: Build GrimAC Bukkit with ShadowJar
        run: ./gradlew :bukkit:assemble -x test -x spotlessCheck --no-daemon

      - name: Rename JAR (bukkit → leaf)
        run: |
          for f in bukkit/build/libs/grimac-bukkit-*.jar; do
            mv "$f" "${f/grimac-bukkit-/grimac-leaf-}"
          done

      - name: Locate Build Artifact
        id: find_jar
        run: |
          JAR_PATH=$(find bukkit/build/libs/ -name "grimac-leaf-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          echo "Found jar: $JAR_PATH"
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
          JAR_NAME=$(basename "$JAR_PATH")
          echo "jar_name=$JAR_NAME" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-leaf-build
          name: "GrimAC (Leaf Build) - Auto-Updated"
          body: |
            Automaticky sestavený nejnovější build GrimAC optimalizovaný pro **Leaf API (Minecraft 26.x)**.
            
            - **Upstream repozitář:** [GrimAnticheat/Grim](https://github.com/GrimAnticheat/Grim) (větev `2.0`)
            - **API cíl:** `cn.dreeam.leaf:leaf-api:26.3.local-SNAPSHOT`
            - **Architektura:** Asynchronní Netty packet processing + tick-synchronní determinismus
            - **Java:** 25 (LTS)
            - **Aktualizováno:** Každou neděli automaticky nebo na vyžádání.
          files: ${{ steps.find_jar.outputs.jar_path }}
          prerelease: false
          draft: false
