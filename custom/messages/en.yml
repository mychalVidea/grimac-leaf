cannot-run-on-self: "<#f51515>Tento příkaz nelze použít na sebe."
upload-log: "<#21DE00>Záznam byl nahrán: <#0a67e5>%url%"
upload-log-start: "<#94a3b8>Nahrávání záznamu, okamžik..."
upload-log-not-found: "<#f51515>Záznam nebyl nalezen."
upload-log-upload-failure: "<#f51515>Nahrávání záznamu selhalo, zkontroluj konzoli."
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<#f51515>Došlo k chybě při zpracování paketů. Kontaktuj administrátora."
    blacklisted-forge: "<#f51515>Použitá verze Forge obsahuje bezpečnostní anomálie a není na serveru povolena."
