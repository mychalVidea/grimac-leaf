webhook-test-failed: "<#f51515>Odeslání testovací zprávy selhalo."

# Valid placeholders:
# %prefix%, %player%, %check_name%, %description%, %experimental%, %vl%, %verbose%
alerts-format: "<#f51515>Detekce: <#0a67e5>%player% &7selhal <hover:show_text:\"<#0a67e5>%check_name%%experimental%\n<#94a3b8>%description%\"><#0a67e5>%check_name%%experimental%</hover> &7(x<#f51515>%vl%&7) <#94a3b8>%verbose%"
alerts-format-proxy: "<#f51515>[Proxy] Detekce: <#0a67e5>%player% &7selhal <#0a67e5>%check_name%%experimental% &7(x<#f51515>%vl%&7) <#94a3b8>%verbose%"
experimental-symbol: "*"

profile:
    - "<#94a3b8>======================"
    - "<#0a67e5>Profil hráče: <#ffffff>%player%"
    - "<#0a67e5>Ping: <#ffffff>%ping% ms"
    - "<#0a67e5>Verze: <#ffffff>%version%"
    - "<#0a67e5>Klient: <#ffffff>%brand%"
    - "<#0a67e5>Horizontální citlivost: <#ffffff>%h_sensitivity%%"
    - "<#0a67e5>Vertikální citlivost: <#ffffff>%v_sensitivity%%"
    - "<#0a67e5>FastMath: <#ffffff>%fast_math%"
    - "<#94a3b8>======================"
help:
    - "<#94a3b8>======================"
    - "<#0a67e5>/grim alerts <#94a3b8>- Přepnutí upozornění"
