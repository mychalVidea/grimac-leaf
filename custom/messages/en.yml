# MYCHAL SMP – Brand Aligned Messages
# Strict compliance with AGENTS.md:
# 1. No prefixes (prefix is empty)
# 2. Brand Colors: Blue (#0a67e5), Red (#f51515), Green (#21DE00), Slate Gray (#94a3b8)
# 3. Premium tone: Clean, no internal strike calculations or noise

prefix: ""

alerts-enabled: "<#21DE00>Upozornění anticheatu byla zapnuta."
alerts-disabled: "<#f51515>Upozornění anticheatu byla vypnuta."
verbose-enabled: "<#21DE00>Podrobný výpis byl zapnut."
verbose-disabled: "<#f51515>Podrobný výpis byl vypnut."
brands-enabled: "<#21DE00>Zobrazování klientských verzí zapnuto."
brands-disabled: "<#f51515>Zobrazování klientských verzí vypnuto."
client-brand-format: "<#0a67e5>%player% &7používá klienta: <#0a67e5>%brand%"
console-specify-target: "<#f51515>V konzoli musíš zadat cílového hráče."
reloading: "<#94a3b8>Načítání konfigurace..."
reloaded: "<#21DE00>Konfigurace byla úspěšně načtena."
reload-failed: "<#f51515>Nepodařilo se načíst konfiguraci."
player-not-found: "<#f51515>Hráč nebyl nalezen nebo je offline."
player-not-this-server: "<#f51515>Hráč se nenachází na tomto serveru."
sender-not-found: "<#f51515>Nemáš oprávnění pro tento příkaz."
