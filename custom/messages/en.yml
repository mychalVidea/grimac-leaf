    - "<#94a3b8>======================"

grim-history-load-failure: "<#f51515>Historie se nepodařila načíst."
grim-history-disabled: "<#94a3b8>Historie je vypnutá."
grim-history-failed: "<#f51515>Chyba při načítání historie: <#94a3b8>%error%"
grim-history-unknown-player: "<#f51515>Neznámý hráč: <#0a67e5>%player%"
