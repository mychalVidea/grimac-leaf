    - "<#0a67e5>/grim perf <#94a3b8>- Výkonnost predikce"
    - "<#0a67e5>/grim reload <#94a3b8>- Znovu načte konfiguraci"
    - "<#0a67e5>/grim spectate <hráč> <#94a3b8>- Sledování hráče"
    - "<#0a67e5>/grim verbose <#94a3b8>- Podrobný výpis všech flagů"
