grim-history-session-not-found: "<#f51515>Relace <#ffffff>%ordinal% <#f51515>nebyla nalezena."

grim-history-header: "<#0a67e5>Historie relací hráče <#ffffff>%player% <#94a3b8>[%page%/%max_pages%]"
grim-history-session: "<hover:show_text:'<#0a67e5>Relace <#94a3b8>%session_uuid%<newline><#94a3b8>Kliknutím zobrazíš detail.'><#94a3b8>[<#0a67e5>%server_name%<#94a3b8>] <#0a67e5>Relace <#ffffff>%ordinal% <#94a3b8>(%duration%, <#f51515>%violations% <#94a3b8>anomálií)%crashed_marker% <#94a3b8>(před %timeago%)</hover>"
grim-history-crashed-marker: " <#f51515>(přerušeno)"

grim-history-detail-header: "<#0a67e5>Detail relace <#ffffff>%ordinal% <#0a67e5>hráče <#ffffff>%player%<#0a67e5>:"
grim-history-detail-meta1: "<#94a3b8>Server: <#ffffff>%server_name%<#94a3b8>, Doba: <#ffffff>%duration%<#94a3b8>, Před: <#ffffff>%timeago%"
grim-history-detail-meta2: "<#94a3b8>Klient: <#ffffff>%client_version% <#94a3b8>(%client_brand%)"
grim-history-detail-violations-header: "<#0a67e5>Zaznamenané anomálie: <#94a3b8>(celkem <#f51515>%violations%<#94a3b8>, unikátních <#0a67e5>%unique_checks%<#94a3b8>)"
grim-history-detail-empty: "<#94a3b8>- (žádné záznamy)"
grim-history-detail-group: "<hover:show_text:'<#0a67e5>Anomálie v <#ffffff>%bucket_start%–%bucket_end%<#0a67e5>:%bucket_hover_entries%'><#94a3b8>- %checks_list% <#94a3b8>(<#0a67e5>%offset%<#94a3b8>)</hover>"
grim-history-detail-group-hover: "<#0a67e5>Anomálie v <#ffffff>%bucket_start%–%bucket_end%<#0a67e5>:%bucket_hover_entries%"
grim-history-detail-group-hover-entry: "<newline><#94a3b8>  %offset% <#0a67e5>%check%<#94a3b8>%description%%verbose%"
grim-history-hover-description: " — <#ffffff>%description%"
grim-history-detail-group-hover-verbose: " — <#94a3b8>%verbose%"
grim-history-detail-entry: "<#94a3b8>- <#ffffff>%check% <#94a3b8>(<#0a67e5>%offset%<#94a3b8>) %verbose%"
grim-history-detail-entry-hover: "<#0a67e5>%check%<#ffffff>%description%<newline><#94a3b8>@ %offset% — anomálie: <#f51515>%vl%%verbose%"
grim-history-detail-entry-hover-verbose: "<newline><#94a3b8>%verbose%"
grim-history-check-count: "<#ffffff>%check_name% <#94a3b8>x<#f51515>%count%"

config-flavor: V2
config-version: 2
